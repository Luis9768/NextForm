spring:
  application:
    name: forms-hq-backend
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB
      file-size-threshold: 2MB
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/formshq;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

management:
  health:
    redis:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

app:
  cache:
    redis-enabled: ${REDIS_ENABLED:false}
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    n8n-api-key: ${N8N_API_KEY:n8n-secret-api-key-2026}
    first-access-password: ${APP_FIRST_ACCESS_PASSWORD:Headset@2026}
    bootstrap-admin:
      name: ${APP_BOOTSTRAP_ADMIN_NAME:Super Admin NextForm}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:supernext@gmail.com}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:Nextformgeral@2026}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      region: ${R2_REGION:auto}
      public-url: ${R2_PUBLIC_URL:}
  integrations:
    directus:
      base-url: ${DIRECTUS_BASE_URL:}
      api-token: ${DIRECTUS_API_TOKEN:}
    customer-api:
      base-url: ${EXTERNAL_CUSTOMER_API_URL:https://api.crm-externo.empresa.com/v1}
      api-token: ${EXTERNAL_CUSTOMER_API_TOKEN:crm-external-bearer-token-2026}
      enabled: ${EXTERNAL_CUSTOMER_API_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
