services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formshq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    expose:
      - "5432"
    volumes:
      - formshq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-formshq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/formshq}
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/formshq}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      N8N_API_KEY: ${N8N_API_KEY:-n8n-secret-api-key-2026}
      APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-Super Admin NextForm}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-supernext@gmail.com}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-Nextformgeral@2026}
      APP_FIRST_ACCESS_PASSWORD: ${APP_FIRST_ACCESS_PASSWORD:-Headset@2026}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      DIRECTUS_BASE_URL: ${DIRECTUS_BASE_URL:-}
      DIRECTUS_API_TOKEN: ${DIRECTUS_API_TOKEN:-}
      DIRECTUS_INITIAL_EVAL_LIMIT: ${DIRECTUS_INITIAL_EVAL_LIMIT:--1}
      CUSTOMER_WEBHOOK_URL: ${CUSTOMER_WEBHOOK_URL:-}
      EXTERNAL_CUSTOMER_API_URL: ${EXTERNAL_CUSTOMER_API_URL:-https://api.crm-externo.empresa.com/v1}
      EXTERNAL_CUSTOMER_API_TOKEN: ${EXTERNAL_CUSTOMER_API_TOKEN:-crm-external-bearer-token-2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_CUSTOMER_WEBHOOK_URL: ${NEXT_PUBLIC_CUSTOMER_WEBHOOK_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      INTERNAL_BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_CUSTOMER_WEBHOOK_URL: ${NEXT_PUBLIC_CUSTOMER_WEBHOOK_URL:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  formshq_pgdata:
